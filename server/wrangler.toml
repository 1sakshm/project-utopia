# Utopia Versus: realtime match server (Cloudflare Workers + Durable Objects).
#   npm run dev      -> ws://localhost:8787 (no Cloudflare account needed locally)
#   npm run deploy   -> needs `npx wrangler login` once
name = "utopia-versus"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

# Players, friends, challenges, match history. Create once with `npx wrangler d1 create utopia`
# and paste the id below; schema lives in ./migrations.
[[d1_databases]]
binding = "DB"
database_name = "utopia"
database_id = "071b0a62-a321-4527-a2ee-cee702da5992"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Match"]

[vars]
# Comma-separated list of origins allowed to open sockets, or "*" for any (fine for local dev).
ALLOWED_ORIGINS = "https://playutopia.tech,https://www.playutopia.tech,https://playutopia.pages.dev,https://project-utopia-zeta.vercel.app"
