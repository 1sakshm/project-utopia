<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#231b52"/>
      <stop offset=".55" stop-color="#120f26"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b99cff" stop-opacity=".45"/>
      <stop offset=".45" stop-color="#b99cff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#b99cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="36%" r="66%">
      <stop offset="0" stop-color="#fff4d0"/>
      <stop offset=".26" stop-color="#ffc6d8"/>
      <stop offset=".42" stop-color="#ff9fbf"/>
      <stop offset=".64" stop-color="#b08cff"/>
      <stop offset=".82" stop-color="#6c5cff"/>
      <stop offset="1" stop-color="#2a1f66"/>
    </radialGradient>
    <radialGradient id="spec" cx="38%" cy="30%" r="18%">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front"><rect x="0" y="256" width="512" height="256" transform="rotate(-16 256 256)"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#halo)"/>
  <!-- orbit (back half) -->
  <ellipse cx="256" cy="256" rx="176" ry="50" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="5" transform="rotate(-16 256 256)"/>
  <!-- planet -->
  <circle cx="256" cy="256" r="108" fill="url(#orb)"/>
  <circle cx="256" cy="256" r="108" fill="url(#spec)"/>
  <!-- orbit (front half, over the planet) -->
  <g clip-path="url(#front)">
    <ellipse cx="256" cy="256" rx="176" ry="50" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" transform="rotate(-16 256 256)" filter="url(#glow)"/>
    <ellipse cx="256" cy="256" rx="176" ry="50" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="4" transform="rotate(-16 256 256)"/>
  </g>
  <!-- moon -->
  <circle cx="405" cy="186" r="15" fill="#fff4d0" filter="url(#glow)"/>
  <circle cx="405" cy="186" r="11" fill="#fff8e6"/>
</svg>
